services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}

  backend_api:
    build: .
    container_name: django_api_1
    restart: always
    ports:
      - "3001:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data: