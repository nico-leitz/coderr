services:
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=django_user
      - POSTGRES_PASSWORD=supergeheimes_passwort

  backend_api:
    build: .
    container_name: django_api_1
    restart: always
    ports:
      - "3001:8000"
    depends_on:
      - db

volumes:
  postgres_data: